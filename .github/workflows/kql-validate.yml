name: kql-validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: kql-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA, not a movable tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned Python dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate rule.yaml structure, ATT&CK ids and query parity
        run: python scripts/validate_rules.py

      - name: Test the validator and the ARM converter
        run: python -m unittest discover -s tests -v

      - name: Check the DCR sample is valid JSON
        run: python -m json.tool deployment/dcr-securityevent.json > /dev/null

      - name: Install the pinned KQL parser from the lockfile
        run: npm ci --ignore-scripts

      - name: Parse and analyse every query.kql
        run: npm run --silent kql-check
